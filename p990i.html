ntById('assembly').append(u);let b=document.createElement('button');b.textContent=name;b.setAttribute('aria-pressed','true');b.onclick=()=>{let off=u.style.display==='none';u.style.display=off?'':'none';b.classList.toggle('off',!off);b.setAttribute('aria-pressed',String(off))};document.getElementById('controls').append(b);let a=document.createElement('article');a.innerHTML=`<svg viewBox="${box}" aria-label="${name}"><use href="#${id}"/></svg><p>${name}</p>`;document.getElementById('cards').append(a)}</script></html>
